services:
  email-service:
    build: .
    container_name: timequant-email-service
    env_file:
      - .env
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - custom_templates:/app/data
      - ./src:/app/src
    restart: unless-stopped

volumes:
  custom_templates:
