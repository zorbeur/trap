<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Un artefact TimeQuant a été partagé avec vous</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <h2>Bonjour,</h2>
    
    <p><strong>{{ sender_name }}</strong> a partagé un artefact (Type: {{ artifact_type }}) avec vous sur TimeQuant.</p>
    
    <p><strong>Nom de l'artefact :</strong> {{ artifact_name }}</p>

    <p style="margin: 30px 0;">
        <a href="{{ view_link }}" style="padding: 10px 15px; background-color: #28a745; color: white; text-decoration: none; border-radius: 5px;">Voir l'artefact</a>
    </p>

    <p>Cordialement,<br>L'équipe TimeQuant</p>
</body>
</html>
